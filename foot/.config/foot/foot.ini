# Wayland terminal for the Sway setup.
font=GeistMono Nerd Font:size=12
font-bold=GeistMono Nerd Font:weight=bold:size=12
font-italic=GeistMono Nerd Font:slant=italic:size=12
font-bold-italic=GeistMono Nerd Font:weight=bold:slant=italic:size=12
pad=8x8
selection-target=clipboard
title=terminal

[scrollback]
lines=50000
multiplier=3.0

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.85
foreground=cdd6f4
background=1e1e2e

regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=bac2de

bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=a6adc8

selection-foreground=cdd6f4
selection-background=313244
cursor=1e1e2e f5e0dc

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh
osc8-underline=url-mode
