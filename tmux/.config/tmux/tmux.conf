# tmux config — default keybindings, Catppuccin Mocha to match Foot.

# --- Terminal -------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,xterm*:RGB"
set -as terminal-features ",*:hyperlinks,*:usstyle"
set -g set-clipboard on
set -g allow-passthrough on
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#S · #W"

# --- Pi wants this -----
set -g extended-keys on
set -g extended-keys-format csi-u

# --- Behavior -------------------------------------------------------------
set -g mouse on
set -sg escape-time 10
set -g history-limit 50000
set -g display-time 2000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on
set -g detach-on-destroy off
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"
set -g monitor-activity on
set -g visual-activity off

# --- Palette (Catppuccin Mocha) ------------------------------------------
# base #1e1e2e  mantle #181825  surface0 #313244  surface1 #45475a
# overlay0 #6c7086  text #cdd6f4  subtext0 #a6adc8
# blue #89b4fa  mauve #cba6f7  green #a6e3a1  peach #fab387  red #f38ba8

# --- Status bar -----------------------------------------------------------
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#181825,fg=#cdd6f4"

set -g status-left-length 40
set -g status-left "#[bg=#{?client_prefix,#f38ba8,#89b4fa},fg=#1e1e2e,bold]  #S #[bg=#181825] "

set -g status-right-length 80
set -g status-right "#{?window_zoomed_flag,#[fg=#fab387] zoom ,}#[fg=#a6adc8] #h #[bg=#313244,fg=#cdd6f4] %a %d %b #[bg=#cba6f7,fg=#1e1e2e,bold] %H:%M "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#6c7086] #I #[fg=#a6adc8]#W#{?window_activity_flag,#[fg=#fab387] •,} "
setw -g window-status-current-format "#[bg=#313244,fg=#89b4fa,bold] #I #[fg=#cdd6f4]#W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-activity-style "none"
setw -g window-status-bell-style "fg=#f38ba8,bold"

# --- Panes ----------------------------------------------------------------
set -g pane-border-lines single
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g display-panes-colour "#6c7086"
set -g display-panes-active-colour "#89b4fa"

# --- Messages, copy mode, menus ------------------------------------------
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cba6f7"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"
setw -g copy-mode-match-style "bg=#45475a,fg=#f9e2af"
setw -g copy-mode-current-match-style "bg=#fab387,fg=#1e1e2e"
set -g menu-style "bg=#181825,fg=#cdd6f4"
set -g menu-selected-style "bg=#89b4fa,fg=#1e1e2e"
set -g menu-border-style "fg=#45475a"
set -g popup-border-style "fg=#45475a"
setw -g clock-mode-colour "#89b4fa"
