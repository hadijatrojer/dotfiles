source=~/.config/hypr/theme.conf

################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=HDMI-A-1,preferred,0x0,1.0
monitor=HDMI-A-2,preferred,1920x0,1.875

workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1 
workspace = 5, monitor:HDMI-A-2
workspace = 6, monitor:HDMI-A-2
workspace = 7, monitor:HDMI-A-2
workspace = 8, monitor:HDMI-A-2
workspace = 9, monitor:HDMI-A-2

###################
### MY PROGRAMS ###
###################

# Set programs that you use
$terminal = ghostty
$fileManager = nautilus
$menu = pkill -x fuzzel; fuzzel
$browser = google-chrome-stable

#################
### AUTOSTART ###
#################

exec-once = pkill -x waybar; waybar
exec-once = pkill -x hypridle; hypridle
exec-once = pkill -x hyprpaper; hyprpaper
exec-once = pkill -x mako; mako

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 2

    border_size = 3

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = $lavender $overlay1 45deg
    col.inactive_border = $mantle

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = $crust
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = gb
    kb_variant =
    kb_model =
    kb_options = caps:escape
    kb_rules =

    follow_mouse = 1

    sensitivity = -0.25 # -1.0 - 1.0, 0 means no modification.
    accel_profile = flat

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

bindd = $mainMod, H, Show Hyprland shortcuts, exec, ~/.config/hypr/cheatsheet.py
bindd = $mainMod, T, Open terminal, exec, $terminal
bindd = $mainMod, F, Open file manager, exec, $fileManager
bindd = $mainMod, B, Open browser, exec, $browser
bindd = $mainMod, E, Emoji picker, exec, ~/dotfiles/scripts/fuzzel-emoji-picker.sh

#bind = $mainMod Shift, S, exec, grim -g "$(slurp)" "$(xdg-user-dir PICTURES)/Screenshots/$(date +'%Y-%m-%d-%H%M%S.png')"
#bind = $mainMod Shift, S, exec, grim -g "$(slurp)" - | flatpak run org.satty.Satty --filename - --output-filename "$(xdg-user-dir PICTURES)/Screenshots/$(date +'%Y-%m-%d-%H%M%S.png')" --early-exit --actions-on-enter save-to-clipboard --save-after-copy --copy-command 'wl-copy'
bindd = $mainMod Shift, S, Screenshot region to satty, exec, $HOME/.cargo/bin/wayfreeze & PID=$!; sleep 0.1; (grim -g "$(slurp)" -; kill $PID) | flatpak run org.satty.Satty --filename - --output-filename "$(xdg-user-dir PICTURES)/Screenshots/$(date +'%Y-%m-%d-%H%M%S.png')" --early-exit --actions-on-enter save-to-clipboard --save-after-copy --copy-command 'wl-copy'


bindd = $mainMod SHIFT, Q, Close window, killactive,
# bind = $mainMod, V, togglefloating,
bindd = $mainMod, SPACE, App launcher, exec, $menu
# bind = $mainMod, P, pseudo, # dwindle
bindd = $mainMod, J, Toggle split layout, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bindd = $mainMod, left, Focus left, movefocus, l
bindd = $mainMod, right, Focus right, movefocus, r
bindd = $mainMod, up, Focus up, movefocus, u
bindd = $mainMod, down, Focus down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bindd = $mainMod, 1, Go to workspace 1, workspace, 1
bindd = $mainMod, 2, Go to workspace 2, workspace, 2
bindd = $mainMod, 3, Go to workspace 3, workspace, 3
bindd = $mainMod, 4, Go to workspace 4, workspace, 4
bindd = $mainMod, 5, Go to workspace 5, workspace, 5
bindd = $mainMod, 6, Go to workspace 6, workspace, 6
bindd = $mainMod, 7, Go to workspace 7, workspace, 7
bindd = $mainMod, 8, Go to workspace 8, workspace, 8
bindd = $mainMod, 9, Go to workspace 9, workspace, 9
bindd = $mainMod, 0, Go to workspace 10, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bindd = $mainMod SHIFT, 1, Send window to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Send window to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Send window to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Send window to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Send window to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Send window to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Send window to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Send window to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Send window to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Send window to workspace 10, movetoworkspace, 10

# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bindd = $mainMod, mouse_down, Next workspace, workspace, e+1
bindd = $mainMod, mouse_up, Previous workspace, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindd = ,XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindd = ,XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindd = ,XF86AudioMute, Toggle output mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindd = ,XF86AudioNext, Next track, exec, playerctl next
bindd = ,XF86AudioPause, Play or pause, exec, playerctl play-pause
bindd = ,XF86AudioPlay, Play or pause, exec, playerctl play-pause
bindd = ,XF86AudioPrev, Previous track, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

layerrule {
    name = fuzzel
    match:namespace = fuzzel
    no_anim = on
}

# Ignore maximize requests from apps. You'll probably like this.
# windowrule {
#   name = ignore-maximize-requests
#   suppress_event = maximize
#   match:class = .*
# }

# Fix some dragging issues with XWayland
windowrule {
  name = xwayland-dragging
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 2
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}

# Rule for the main Steam client
windowrule {
  name = steam-client
  workspace = 10 silent
  match:class = ^(steam)$
}

# Rule for all Steam games (using the standard steam_app_ID class)
windowrule {
  name = steam-games
  workspace = 10 silent
  match:initial_class = ^(steam_app_\d+)$
}

# Force Chrome Picture-in-Picture to float and stay on top of all workspaces
windowrule {
  name = pnp
  float = on
  pin = on
  move = ((monitor_w*1)-window_w-20) ((monitor_h*1)-h-20)
  size = (monitor_w*0.25) (monitor_h*0.25)
  stay_focused = on
  match:title = ^(Picture in Picture)$
}
