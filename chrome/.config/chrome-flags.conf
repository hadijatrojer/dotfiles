# One flag per line; blank lines and # comments are ignored.
# Read by ~/.local/bin/chrome-launch (Fedora's Chrome RPM ignores this file).
#
# Render through ANGLE's Vulkan backend (RADV) instead of the default GL
# backend (radeonsi), which keeps hanging the Rembrandt iGPU
# ("ring gfx_0.0.0 timeout ... Process chrome"), dropping Meet video.
# Revert: delete the line, or set "Use graphics acceleration" off in Settings.
--use-angle=vulkan
