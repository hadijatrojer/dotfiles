# Prefer compressed swap over evicting useful filesystem cache. Values above
# 100 are intentional when swap is in RAM rather than on slow storage.
vm.swappiness = 180

# Swap I/O clustering helps disks, but wastes work and RAM with page-addressable
# zram. Read and write only the pages reclaim actually requests.
vm.page-cluster = 0

# Maintain enough free memory to avoid latency spikes from direct reclaim.
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

